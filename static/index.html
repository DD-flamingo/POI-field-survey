<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202B">
<title>POI field survey</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-row">
    <h1>POI field survey</h1>
    <a class="link" href="/map">Map</a>
  </div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span id="progress-fill"></span>
  </div>
  <p class="bar-meta">
    <span id="page-count">Section 1 of 4</span>
    <button type="button" id="queue-btn" class="queue" hidden>
      <span id="queue-count">0</span> waiting to upload
    </button>
  </p>
</header>

<main id="form-root" class="sheet"><!-- pages render here --></main>

<footer class="actions">
  <button type="button" id="back-btn" class="btn ghost">Back</button>
  <button type="button" id="draft-btn" class="btn ghost">Save draft</button>
  <button type="button" id="next-btn" class="btn primary">Next</button>
  <button type="button" id="submit-btn" class="btn primary" hidden>Send record</button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<dialog id="queue-panel" class="panel">
  <h2>Records on this device</h2>
  <p class="panel-note">
    Records stay in this browser until they upload — closing the tab or losing
    signal won't lose them. Upload runs automatically every 5 minutes while the
    page is open and online.
  </p>
  <ul id="queue-list" class="queue-list"></ul>
  <div class="panel-actions">
    <button type="button" id="upload-now" class="btn primary">Upload now</button>
    <button type="button" id="export-queue" class="btn ghost">Export as JSON</button>
    <button type="button" id="close-panel" class="btn ghost">Close</button>
  </div>
</dialog>

<script src="/static/form.js"></script>
</body>
</html>
